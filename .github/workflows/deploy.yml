name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sharedplaylist-vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - deploy
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Run VM deploy script
        shell: bash
        run: |
          set -euo pipefail
          "${SHAREDPLAYLIST_DEPLOY_SCRIPT:?Set SHAREDPLAYLIST_DEPLOY_SCRIPT in the runner environment}"
